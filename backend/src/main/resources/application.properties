spring.application.name=wasteless
# Railway injects PORT at runtime; fall back to 8080 locally
server.port=${PORT:8080}
# Max size per file
spring.servlet.multipart.max-file-size=10MB

# Max total request size
spring.servlet.multipart.max-request-size=50MB

# Tomcat-specific limits:
server.tomcat.max-parameters=2000
server.tomcat.max-swallow-size=52428800

# Auth: access tokens are HS256 JWTs signed with JWT_SECRET (at least 32 bytes)
app.auth.jwt-secret=${JWT_SECRET}
app.auth.access-token-minutes=15
app.auth.refresh-token-days=30
# Comma-separated Google OAuth client IDs whose ID tokens are accepted
app.auth.google-client-ids=${GOOGLE_CLIENT_IDS:}
app.auth.google-jwks-uri=${GOOGLE_JWKS_URI:https://www.googleapis.com/oauth2/v3/certs}

# Email verification codes go out through Resend's HTTPS API
# (Railway blocks outbound SMTP below the Pro plan)
app.mail.from=${MAIL_FROM:Wasteless <no-reply@biokeyper.com>}
app.mail.resend-api-key=${RESEND_API_KEY:}
app.mail.resend-api-url=${RESEND_API_URL:https://api.resend.com}
