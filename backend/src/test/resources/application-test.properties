# Tests don't load the .env the app reads at startup, so everything the context needs is here.
# Profile-specific properties win over application.yaml, which points at a real Postgres.
# Plain H2, not its PostgreSQL mode, which has no TINYINT for the entities' enum columns
spring.datasource.url=jdbc:h2:mem:wasteless;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

app.auth.jwt-secret=test-only-secret-key-long-enough-for-hs256-signing
app.mail.resend-api-key=test-only-key

# The S3 client is built from these but never reaches the network in tests
R2_ENDPOINT=http://localhost:1
R2_ACCESS_KEY_ID=test
R2_SECRET_ACCESS_KEY=test
R2_BUCKET=test-bucket
R2_PUBLIC_URL=http://localhost:1
